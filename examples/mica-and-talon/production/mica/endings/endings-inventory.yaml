format: openggf-ending-art-inventory-1
scope:
  base_branch: feature/ai-original-character
  routes:
  - SONIC_ALONE
  - SONIC_AND_TAILS
  games:
  - s1
  - s2
  - s3k_locked_on
  purpose: Research and drawing estimate only; no art, runtime replacement or pixel certification.
  counting: Native bespoke character-bearing mapping slots plus photo panels; shared route uses counted once. Full
    playable banks are listed separately, NOT added to bespoke totals. Native frame means artwork selector, not
    elapsed video ticks.
  sizes: bounds_px = [left, top, width, height] from sprite pieces in pinned sources; includes composite plane where
    applicable; tile bounds can include transparent pixels. Photo bounds are full panels.
  estimate: Conservative drawing slots, no cross-game deduplication; mirrored/confused S1 pair counted separately.
    Playable reuse is a pose approximation, not a pixel-identical native replacement.
  excluded:
  - Tails-alone and Knuckles routes
  - standalone Sonic 3 Launch Base ending (not reached in locked-on S3K)
  - title lettering without a character picture
  - Eggman, Egg Robo, Mecha Sonic, animals and emeralds (not MICA)
