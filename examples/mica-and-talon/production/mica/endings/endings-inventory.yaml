non_character_surfaces:
- game: s1
  sequence: TRY AGAIN / END after credits
  owner: src/main/java/com/openggf/game/sonic1/credits/TryAgainEndManager.java
  note: Eggman plus missing emeralds or END text; no Sonic portrait. Zero MICA frames.
- game: s2
  sequence: 21 credit text slides and post-credits flashing wordmark
  owner: src/main/java/com/openggf/game/sonic2/credits/Sonic2CreditsTextRenderer.java + Sonic2LogoFlashManager.java
  note: Text and 128x48 wordmark, no character portrait; zero ending character drawings. W4 name/branding scope
    separate.
- game: s3k
  sequence: post-credits bad Eggman / ordinary-good Egg Robo
  owner: src/main/java/com/openggf/game/sonic3k/ending/S3kPostCreditsObjectInstance.java
  note: No main-player character; Super-Emerald +2 alone selects trio. Logos have separate branding scope.
engine_changes_required:
- owner: src/main/java/com/openggf/game/sonic1/objects/Sonic1EndingSonicObjectInstance.java
  reason: Supply character-owned END_SONIC scene sheet and palette rather than fixed renderer; preserve good/bad
    sequencing.
- owner: src/main/java/com/openggf/game/sonic2/credits/Sonic2EndingCutsceneManager.java + Sonic2EndingArt.java
  reason: Wire mod presentation from CharacterDefinition, add picture tiles/maps replacement, preserve actual Super
    rotation/departure/final23 path and powered playable art. Existing internal seam is not a complete custom-art
    contract.
- owner: src/main/java/com/openggf/game/sonic3k/ending/EndingRescueDirectorObjectInstance.java + EndingKnucklesFlightChildObjectInstance.java
  reason: Replace raw frame IDs with canonical pose selectors, supply tiny-passenger and pose scene sheets; replace
    hard-wired pose palettes. Use form capability operations instead of native-controller instanceof checks.
- owner: src/main/java/com/openggf/game/sonic3k/ending/S3kPostCreditsObjectInstance.java
  reason: Override only Sonic child frames1..4 in S3_GRAPHICS; preserve independent companions, priorities and native
    timing.
- owner: src/main/java/com/openggf/game/sonic3k/ending/EndingNativePlayerBinding.java
  reason: ProfileSuperStateController bypasses native binding, while director expects native ending methods. Bridge
    ending operations to profile without loading Sonic art by mod code.
