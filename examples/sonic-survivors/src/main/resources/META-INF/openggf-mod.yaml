description: A bounce-driven survivors roguelike for Sonic 2. Fight uncapped hordes through escalating encounters and warned surges, earn eight-second Fever bursts, and play five-minute stages and unlock ten-minute and unlimited modes after your first boss clear. Survive timed or endless waves of zone badniks with hitpoints in a walled arena cut from each act, chain bounces for combo multipliers, pick bounce-triggered weapons and passives on every level-up, beat each zone's Eggman, choose your next act, and bank rings and Chaos Emeralds for permanent upgrades between runs.
