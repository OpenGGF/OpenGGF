# Multiplayer master server per branch channel: the only list. Keep it identical on
# every branch. Players type the host; its port is published in DNS as
#   _openggf._tcp.<host>.  SRV 0 0 <port> <host>.
# Player builds read it at packaging (pom openggf.multiplayer.channel, through
# BundledNetworkDefaults); CI's deploy-multiplayer job reads its endpoint and checks
# the published SRV record against it (racing/deploy/master_channels.py).
master=multi.openggf.com:27900
develop=multi-dev.openggf.com:27910
next=multi-next.openggf.com:27920
