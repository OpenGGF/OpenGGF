name: Git integration tools

on:
  pull_request:
    paths:
      - 'tools/git/integrate.py'
      - 'tools/git/test_integrate.py'
      - '.github/workflows/git-integration-tools.yml'
  push:
    branches: [develop, next]
    paths:
      - 'tools/git/integrate.py'
      - 'tools/git/test_integrate.py'
      - '.github/workflows/git-integration-tools.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify disposable Git repositories and process leases
        run: python3 -m unittest discover -s tools/git -p 'test_integrate.py' -v
