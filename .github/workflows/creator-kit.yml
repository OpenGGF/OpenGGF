name: Candidate creator kit

# Build downloadable unpublished artifacts; publishing remains master-only in release.yml.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'src/main/**'
      - 'src/test/resources/mods/**'
      - 'examples/**'
      - 'docs/modding/**'
      - 'tools/modding/**'
      - 'pom.xml'
      - '.github/workflows/creator-kit.yml'

permissions:
  contents: read

jobs:
  creator-kit:
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Verify portable kit tooling
        run: python3 -m unittest discover -s tools/modding -p 'test_*.py'
      - name: Build matching candidate artifacts
        run: mvn -B -Dmse=off -DskipTests -Puniversal-jar package
      - name: Assemble reproducible creator kit
        run: python3 tools/modding/build_creator_kit.py --out "$RUNNER_TEMP/OpenGGF-creator-kit.zip"
      - name: Compile and rebuild using only exported artifacts
        shell: bash
        run: |
          unzip -q "$RUNNER_TEMP/OpenGGF-creator-kit.zip" -d "$RUNNER_TEMP/creator-kit"
          cd "$RUNNER_TEMP/creator-kit"
          for kind in music reskin object character zone scene standalone; do
            sh ggfmod init "$RUNNER_TEMP/creator-project-$kind" --id "creator-$kind" --kind "$kind" --package "example.$kind"
            mvn -B -q -f "$RUNNER_TEMP/creator-project-$kind/pom.xml" package -Dopenggf.engine.jar="$PWD/engine.jar" -Dopenggf.sdk.jar="$PWD/sdk.jar"
            # Source edits must be reflected by the next normal package invocation.
            sed -i 's/description:/description: Rebuilt/' "$RUNNER_TEMP/creator-project-$kind/src/main/resources/META-INF/openggf-mod.yaml"
            mvn -B -q -f "$RUNNER_TEMP/creator-project-$kind/pom.xml" package -Dopenggf.engine.jar="$PWD/engine.jar" -Dopenggf.sdk.jar="$PWD/sdk.jar"
            sh ggfmod validate "$RUNNER_TEMP/creator-project-$kind/target/creator-$kind-mod.jar" --format json
          done
          for project in examples/*; do
            python3 tools/build_project.py "$project"
          done
          version=$(python3 -c 'import json; print(json.load(open("creator-kit.json"))["engineVersion"])')
          python3 tools/build_project.py examples/hello-scene --testkit "$PWD/mod-testkit.jar" --verify-only
          # Local candidate installation supplies test-scope dependencies; no repository publication.
          mvn -B -q org.apache.maven.plugins:maven-install-plugin:3.1.4:install-file -Dfile="$PWD/mod-testkit.jar" -DgroupId=com.openggf -DartifactId=OpenGGF -Dversion="$version" -Dclassifier=mod-testkit -Dpackaging=jar -DgeneratePom=true
          mvn -B -q -f examples/hello-scene/pom.xml package -Pcreator-tests -Dopenggf.testkit.version="$version" -Dopenggf.engine.jar="$PWD/engine.jar" -Dopenggf.sdk.jar="$PWD/sdk.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: OpenGGF-unpublished-creator-kit
          path: ${{ runner.temp }}/OpenGGF-creator-kit.zip
          if-no-files-found: error
