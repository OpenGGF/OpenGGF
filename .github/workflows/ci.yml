name: CI

# Which events run what (TestBuildToolingGuard pins this):
#
#   develop / next push   basic CI: the bounded smoke suite, once the branch has
#                         had no push for 30 minutes (see the smoke job). Enough
#                         to show the code is broken or a release build is likely
#                         to fail. When smoke passes, deploy-multiplayer
#                         redeploys that branch's multiplayer testbed server.
#   non-draft PR         routine CI: branch policy, the bounded smoke suite and
#                         the structural guards. Draft PRs run nothing until they
#                         are marked ready for review.
#   master push           nothing here; release.yml runs full validation, builds
#                         the native packages and publishes.
#   feature/bugfix push   nothing. Open a PR, or run the workflow by hand.
#   manual dispatch       routine CI on the chosen ref, plus the ROM-fixture develop
#                         trace replay when trace_replay is ticked.
#
# Native packaging is not built here; release.yml builds it on master pushes.
on:
  push:
    branches:
      - develop
      - next
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      trace_replay:
        description: 'Also replay develop traces against the ROM fixtures on the self-hosted runner'
        type: boolean
        default: false

# A new push supersedes the pending or running check for the same pull request or
# integration branch; for develop/next this is what restarts the quiet period.
# The event name keeps manual runs and pushes on the same ref from cancelling
# each other.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Branch/trailer/changelog policy for the proposed range. The .githooks enforce
  # the same policy at commit time, and release.yml's ci-push step covers master
  # pushes.
  policy:
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Refs arrive through the environment: a fork names its own head branch,
      # and an expression expanded into the script would run as shell.
      - name: Validate pull request branch policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: bash .githooks/validate-policy.sh ci-pr "$BASE_SHA" "$HEAD_SHA" "$BASE_REF" "$HEAD_REF"

  # The bounded smoke suite is also Maven's default. PR/manual checks use
  # the same suite; only the Release workflow opts into full-suite.
  # Structural guards run separately on PRs/manual CI and before release.
  # Run `mvn -Dmse=off -Pguards test -B` locally before delivery.
  #
  # Quiet period: the ci-quiet-period environment (repository settings ->
  # Environments) has a 30-minute wait timer and admits only develop and next. The
  # job waits there without a runner, and the concurrency group above cancels the
  # wait when another push lands, so a burst of pushes costs one smoke run, taken
  # 30 minutes after the last of them. Change the delay in the environment, not
  # here. If the environment is deleted, GitHub recreates it without a timer and
  # smoke runs on every push again.
  smoke:
    if: github.event_name == 'push'
    environment: ci-quiet-period
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Pixel tests create a Mesa surfaceless EGL context without a desktop.
      - name: Install offscreen rendering dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri

      - name: Verify test category selection and retention
        run: python3 -m unittest discover -s tools/testing -p 'test_run_categor*.py'

      - name: Verify translation authoring tools and catalog metadata
        run: |
          python3 -m unittest discover -s tools/i18n -p 'test_*.py'
          python3 tools/i18n/catalogs.py check

      - name: Run smoke suite (push)
        if: github.event_name == 'push'
        shell: bash
        run: mvn -Dmse=off -Psmoke test -B -DmodApi.destinationBranch="${{ github.ref_name }}" -Dopenggf.multiplayer.channel="${{ github.ref_name }}"

      - name: Assert smoke coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          reports = sorted(Path("target/surefire-reports").glob("TEST-*.xml"))
          total = 0
          skipped = 0
          for report in reports:
              root = ET.parse(report).getroot()
              total += int(root.attrib.get("tests", "0"))
              skipped += int(root.attrib.get("skipped", "0"))

          executed = total - skipped
          # The full suite executes about 14,300. A smoke run that drops below
          # this is excluding far more than the tagged oracle sweeps -- most
          # likely a profile or tag typo that quietly selected almost nothing.
          minimum = 10000
          if executed < minimum:
              print(
                  f"Smoke CI executed too few tests: executed={executed} "
                  f"total={total} skipped={skipped} minimum={minimum}",
                  file=sys.stderr)
              sys.exit(1)

          print(f"Smoke coverage: executed={executed} total={total} skipped={skipped}")
          PY

  # Multiplayer testbed: after smoke passes on a develop/next push, publish the
  # branch's multiplayer master as a rolling prerelease and redeploy its AMP
  # instance (multi-dev.openggf.com:27910 for develop, multi-next.openggf.com:27920
  # for next). The endpoint comes from racing/deploy/master-channels.properties,
  # the list player builds also read; the job first requires the published
  # _openggf._tcp SRV record to match it and fails on drift without editing DNS.
  # Each branch's GitHub environment (multiplayer-dev, multiplayer-next) admits
  # only that branch and holds AMP_INSTANCE_ID and RELEASE_TAG variables plus the
  # AMP_PASSWORD secret; AMP_URL and AMP_USERNAME are repository variables. The instances use the openggf-multi template from
  # github.com/OpenGGF/openggf-amp-templates. See racing/deploy/README.md.
  deploy-multiplayer:
    if: github.event_name == 'push'
    needs: smoke
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'next' && 'multiplayer-next' || 'multiplayer-dev' }}
    permissions:
      contents: write
    concurrency:
      group: multiplayer-deploy-${{ github.ref_name }}
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check the published master SRV record against the channel catalogue
        run: |
          command -v dig >/dev/null || { sudo apt-get update && sudo apt-get install --yes dnsutils; }
          python3 racing/deploy/master_channels.py check-srv "$GITHUB_REF_NAME"

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Build multiplayer server distribution
        run: python3 racing/server/build.py --distribution

      - name: Publish rolling prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ vars.RELEASE_TAG }}
        shell: bash
        run: |
          set -euo pipefail
          (cd target/racing-server/dist && python3 -m zipfile -c ../../openggf-racing-server.zip bin lib distribution.json)
          git push --force origin "${GITHUB_SHA}:refs/tags/${RELEASE_TAG}"
          notes="Rolling build of the multiplayer master server from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA:0:12}, deployed to the multiplayer testbed by CI. Replaced on each deploy; not a player release."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" target/openggf-racing-server.zip --clobber
            gh release edit "$RELEASE_TAG" --prerelease --latest=false --notes "$notes"
          else
            gh release create "$RELEASE_TAG" target/openggf-racing-server.zip --verify-tag --prerelease \
              --latest=false --title "Multiplayer master (${GITHUB_REF_NAME}, rolling)" --notes "$notes"
          fi

      - name: Deploy to AMP
        env:
          AMP_URL: ${{ vars.AMP_URL }}
          AMP_USERNAME: ${{ vars.AMP_USERNAME }}
          AMP_PASSWORD: ${{ secrets.AMP_PASSWORD }}
        run: |
          endpoint="$(python3 racing/deploy/master_channels.py endpoint "$GITHUB_REF_NAME")"
          python3 racing/deploy/amp_deploy.py --instance-id "${{ vars.AMP_INSTANCE_ID }}" --endpoint "$endpoint"

  # Structural guards: the invariants no trace fixture can prove. PR/manual CI only
  # (non-draft pull requests and manual dispatch); release.yml runs them again
  # before publishing.
  guards:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    env:
      LUA_BIN: lua5.4
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # TestBuildToolingGuard replays real history against the policy script
          # -- `git show 53de63da2:...` for the machine-local-path grandfather
          # baseline, and `git switch -c <branch> ccdd33edf4...` to rebuild the
          # cutover repositories its branch-policy cases need. actions/checkout
          # defaults to a depth-1 clone, so those commits are absent and eight
          # cases fail in CI while passing on any developer clone. The policy
          # job above already takes full history for the same reason.
          fetch-depth: 0

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Install Lua 5.4
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes lua5.4
          "$LUA_BIN" -e 'assert(_VERSION == "Lua 5.4")'

      - name: Run structural guards
        run: mvn -Dmse=off -Pguards test -B

  # Maven defaults to the bounded smoke suite for PRs and manual dispatch.
  # Exhaustive ordinary sweeps are reserved for the Release workflow.
  #
  # ROM-free either way: ROM-gated classes error only when a path is supplied.
  test:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      # Pixel tests create a Mesa surfaceless EGL context without a desktop.
      - name: Install offscreen rendering dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1 libegl-mesa0 libgl1 libgl1-mesa-dri

      - name: Verify test category selection and retention
        run: python3 -m unittest discover -s tools/testing -p 'test_run_categor*.py'

      - name: Run tests (pull request)
        if: github.event_name == 'pull_request'
        shell: bash
        # The multiplayer channel (each build's default master) follows the base branch;
        # bases other than master/develop/next use develop's, like local builds.
        run: mvn -Dmse=off test -B -DmodApi.destinationBranch="${{ github.base_ref }}" -Dopenggf.multiplayer.channel="${{ contains(fromJSON('["master","develop","next"]'), github.base_ref) && github.base_ref || 'develop' }}"

      - name: Run tests (manual)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: mvn -Dmse=off test -B

      - name: Assert default test coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          reports = sorted(Path("target/surefire-reports").glob("TEST-*.xml"))
          total = 0
          skipped = 0
          for report in reports:
              root = ET.parse(report).getroot()
              total += int(root.attrib.get("tests", "0"))
              skipped += int(root.attrib.get("skipped", "0"))

          executed = total - skipped
          minimum = 10000
          if executed < minimum:
              print(
                  f"Default CI executed too few tests: executed={executed} "
                  f"total={total} skipped={skipped} minimum={minimum}",
                  file=sys.stderr)
              sys.exit(1)

          print(f"Default CI coverage: executed={executed} total={total} skipped={skipped}")
          PY

  # Manual opt-in only (Actions -> CI -> Run workflow, tick trace_replay). It
  # needs the self-hosted runner that holds the ROM fixtures.
  develop-trace-replay:
    if: github.event_name == 'workflow_dispatch' && inputs.trace_replay
    runs-on: [self-hosted, release-fixtures]
    env:
      SONIC1_ROM_PATH: ${{ vars.SONIC1_ROM_PATH }}
      SONIC2_ROM_PATH: ${{ vars.SONIC2_ROM_PATH }}
      S3K_ROM_PATH: ${{ vars.S3K_ROM_PATH }}
    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      # This manual-only job tests develop, while github.sha identifies the
      # revision selected for workflow_dispatch and supplies its validator.
      - name: Checkout trace validation tooling from workflow revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: .trace-validation-tools
          sparse-checkout: tools/testing/validate-trace-reports.py
          sparse-checkout-cone-mode: false

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Verify trace replay ROM paths
        shell: bash
        run: |
          missing=0
          for var in SONIC1_ROM_PATH SONIC2_ROM_PATH S3K_ROM_PATH; do
            value="${!var:-}"
            if [ -z "$value" ]; then
              echo "::error ::$var must point to a develop trace-validation ROM fixture."
              missing=1
            elif [ ! -f "$value" ]; then
              echo "::error ::$var points to '$value', but that file does not exist."
              missing=1
            fi
          done
          exit "$missing"

      - name: Run trace replay profile
        shell: bash
        run: |
          mvn -Dmse=off test -Ptrace-replay -B \
            -Dsonic1.rom.path="${SONIC1_ROM_PATH}" \
            -Dsonic2.rom.path="${SONIC2_ROM_PATH}" \
            -Ds3k.rom.path="${S3K_ROM_PATH}"

      - name: Assert trace replay coverage
        shell: bash
        run: |
          python3 - <<'PY'
          import fnmatch
          import re
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          surefire_dir = Path("target/surefire-reports")
          source_root = Path("src/test/java/com/openggf/tests/trace")
          diagnostic_excludes = (
              "Debug*.java",
              "*Debug*.java",
              "*Probe.java",
              "*Probe*.java",
          )

          def is_diagnostic(source):
              return any(fnmatch.fnmatch(source.name, pattern)
                         for pattern in diagnostic_excludes)

          expected_policy_reports = set()
          expected_trace_reports = set()
          required_keep_green_reports = {
              "TEST-com.openggf.tests.trace.s2.TestS2SpecialStageTraceReplay.xml",
          }
          for source in sorted(source_root.rglob("Test*.java")):
              if is_diagnostic(source):
                  continue
              rel = source.relative_to(Path("src/test/java")).with_suffix("")
              report_name = f"TEST-{'.'.join(rel.parts)}.xml"
              expected_policy_reports.add(report_name)
              if source.name.endswith("TraceReplay.java"):
                  expected_trace_reports.add(report_name)

          untracked_keep_green = required_keep_green_reports - expected_trace_reports
          if untracked_keep_green:
              print("Required keep-green traces are outside the replay profile:", file=sys.stderr)
              for name in sorted(untracked_keep_green):
                  print(name, file=sys.stderr)
              sys.exit(1)

          missing_policy = [
              name for name in sorted(expected_policy_reports)
              if not (surefire_dir / name).exists()
          ]
          if missing_policy:
              print("Missing expected trace policy reports:", file=sys.stderr)
              for name in missing_policy:
                  print(f"{surefire_dir / name}", file=sys.stderr)
              sys.exit(1)

          missing_trace = [
              name for name in sorted(expected_trace_reports)
              if not (surefire_dir / name).exists()
          ]
          if missing_trace:
              print("Missing expected trace replay reports:", file=sys.stderr)
              for name in missing_trace:
                  print(f"{surefire_dir / name}", file=sys.stderr)
              sys.exit(1)

          expected_trace_executed = 0
          for report_name in sorted(expected_policy_reports):
              report = surefire_dir / report_name
              root = ET.parse(report).getroot()
              tests = int(root.attrib.get("tests", "0"))
              skipped = int(root.attrib.get("skipped", "0"))
              executed = tests - skipped
              if executed <= 0:
                  print(
                      f"Expected trace report did not execute: {report} "
                      f"tests={tests} skipped={skipped}",
                      file=sys.stderr)
                  sys.exit(1)
              if report_name in expected_trace_reports:
                  expected_trace_executed += executed

          reports = sorted(surefire_dir.glob("com.openggf.tests.trace*TraceReplay.txt"))
          total = 0
          skipped = 0
          skipped_reports = []
          for report in reports:
              text = report.read_text(encoding="utf-8", errors="replace")
              match = re.search(r"Tests run: (\d+), Failures: \d+, Errors: \d+, Skipped: (\d+)", text)
              if not match:
                  continue
              run_count = int(match.group(1))
              skipped_count = int(match.group(2))
              total += run_count
              skipped += skipped_count
              if skipped_count > 0:
                  skipped_reports.append((report, skipped_count))

          executed = total - skipped
          if executed == 0:
              print("Trace replay profile produced no executed ROM-backed trace tests", file=sys.stderr)
              print(f"trace_reports={len(reports)} total={total} skipped={skipped}", file=sys.stderr)
              sys.exit(1)

          if skipped_reports:
              print("Trace replay skipped tests are develop-blocking", file=sys.stderr)
              for report, skipped_count in skipped_reports:
                  print(f"{report}: skipped={skipped_count}", file=sys.stderr)
              sys.exit(1)

          print(
              f"Develop trace replay coverage: executed={executed} total={total} "
              f"expected_trace_executed={expected_trace_executed} "
              f"expected_trace_reports={len(expected_trace_reports)}")
          PY
          python3 .trace-validation-tools/tools/testing/validate-trace-reports.py \
            --root target/trace-reports \
            --fail-on-warnings \
            --warning-context develop-blocking \
            --require-clean-profile special-stage \
            --require-clean-logical-key s2_special_stage_0 \
            --require-clean-lane s2-0
