# paletteLine is a BASE, not the final CRAM line: SpritePieceRenderer.preparePiece
# computes the rendered line as (paletteLine + piece.paletteIndex) & 0x3 (Genesis
# art_tile-addition semantics). Every piece below declares paletteIndex: 0, so this
# sheet renders on CRAM line (1 + 0) & 3 = 1 -- the tile/object color line the
# level's palette.gpal actually populates. Do not bump paletteIndex to 1: that
# would move rendering to line 2, which this mod's 2-line GPAL leaves zero-filled
# (solid black). Note the declared 16-color palette list below is used only at
# convert time for exact pixel quantization; at runtime the colors come from the
# level GPAL at the computed line.
formatVersion: 1
paletteLine: 1
palette: ["#000000", "#FFDB00", "#B69200", "#6D4900", "#FFFF92", "#DBB624", "#926D00", "#492400", "#FFFFFF", "#242424", "#DBDB00", "#B6B600", "#929200", "#6D6D00", "#494900", "#FFDB49"]
frames:
  - delay: 6
    pieces:
      - { sourceX: 0, sourceY: 0, widthPixels: 16, heightPixels: 16, xOffset: -8, yOffset: -8, hFlip: false, vFlip: false, paletteIndex: 0, priority: false }
  - delay: 6
    pieces:
      - { sourceX: 0, sourceY: 16, widthPixels: 16, heightPixels: 16, xOffset: -8, yOffset: -8, hFlip: false, vFlip: false, paletteIndex: 0, priority: false }
  - delay: 6
    pieces:
      - { sourceX: 0, sourceY: 32, widthPixels: 16, heightPixels: 16, xOffset: -8, yOffset: -8, hFlip: false, vFlip: false, paletteIndex: 0, priority: false }
  - delay: 6
    pieces:
      - { sourceX: 0, sourceY: 48, widthPixels: 16, heightPixels: 16, xOffset: -8, yOffset: -8, hFlip: false, vFlip: false, paletteIndex: 0, priority: false }
